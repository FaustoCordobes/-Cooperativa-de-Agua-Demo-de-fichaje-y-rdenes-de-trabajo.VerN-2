// Fotos en IndexedDB (sobreviven al cierre y no llenan localStorage)
const fotosDB = (() => {
  let p;
  const abrir = () => (p ??= new Promise((res, rej) => {
    const r = indexedDB.open("coopagua-fotos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("fotos");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (modo, fn) => { const db = await abrir(); return new Promise((res, rej) => { const t = db.transaction("fotos", modo); const r = fn(t.objectStore("fotos")); t.oncomplete = () => res(r?.result); t.onerror = () => rej(t.error); }); };
  return { put: (k, v) => tx("readwrite", (s) => s.put(v, k)), get: (k) => tx("readonly", (s) => s.get(k)), limpiar: () => tx("readwrite", (s) => s.clear()) };
})();
async function comprimir(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.72);
}

// =====================================================================
// "Servidor": valida y aplica. Siempre devuelve un resultado.
// =====================================================================
function aplicarAccion(db, a, real) {
  const at = a.atDeclarada ?? a.at;
  const meta = { atToque: a.at, recibido: real ? ahora() : null, corregida: a.atDeclarada != null, demora: real ? ahora() - a.at > 2 * MIN : false, ubic: a.ubic ?? null, autorId: a.personaId };

  if (a.tipo === "fichar") {
    const ids = a.personas?.length ? a.personas : [a.personaId], problemas = [];
    for (const pid of ids) {
      const abierto = db.fichajes.find((f) => f.personaId === pid && !f.salida);
      if (a.fichaje === "entrada") {
        if (abierto) { problemas.push(`${pid === a.personaId ? "Ya tenías" : `${corto(pid)} ya tenía`} un turno abierto desde ${fechaHora(abierto.entrada)}: no se abrió otro.`); continue; }
        db.fichajes.push({ id: `${a.id}-${pid}`, personaId: pid, entrada: at, salida: null, fichadoPor: a.personaId, meta: { entrada: meta } });
      } else {
        if (!abierto) { problemas.push("No había un turno abierto para cerrar."); continue; }
        abierto.salida = Math.max(at, abierto.entrada); abierto.meta.salida = meta;
      }
    }
    return problemas.length ? { ok: false, motivo: problemas.join(" ") } : { ok: true };
  }

  const o = db.ordenes.find((x) => x.id === a.ordenId);
  if (!o) return { ok: false, motivo: "La orden ya no existe." };
  if (o.estado === "cancelada") return { ok: false, motivo: `La oficina canceló la OT-${o.numero}. Lo que registraste no se aplicó.` };

  if (["nota", "novedad", "foto"].includes(a.evento)) {
    if (!o.asignados.includes(a.personaId)) return { ok: false, motivo: `Ya no estás asignado a la OT-${o.numero}.` };
    if (a.evento === "foto") o.fotos.push({ id: a.fotoId, at, autorId: a.personaId, momento: a.momento });
    else {
      o.notas.push({ id: a.id, at, autorId: a.personaId, texto: a.texto, tipo: a.evento, ...(real ? { recibido: ahora() } : {}) });
      if (a.evento === "novedad") o.novedad = { texto: a.texto, at, autorId: a.personaId };
    }
    o.ultimaNovedad = Math.max(o.ultimaNovedad ?? 0, at);
    return { ok: true };
  }

  if (o.liderId !== a.personaId) return { ok: false, motivo: `Ya no sos líder de la OT-${o.numero}: ahora la registra ${corto(o.liderId)}. Tu registro no se aplicó.` };
  if (a.evento === "visto") { if (!o.visto) { o.visto = at; o.eventos.push({ tipo: "visto", at, ...meta }); } return { ok: true }; }
  if (o.estado === "bloqueada") return { ok: false, motivo: `La OT-${o.numero} está esperando una decisión de la oficina.` };
  if (o.estado === "finalizada") return { ok: false, motivo: `La OT-${o.numero} ya estaba resuelta.` };

  const t = Math.max(at, o.creada);
  const nuevo = a.evento === "resultado" ? (a.resultado === "resuelto" ? "finalizada" : "bloqueada") : a.evento;
  if (EST[nuevo].rango < EST[o.estado].rango) return { ok: true }; // evento viejo que llegó tarde: no hace retroceder
  o.estado = nuevo;
  if (!o.visto) o.visto = t;
  o.enCamino = o.enCamino ? Math.min(o.enCamino, t) : t;
  if (a.evento !== "en_camino") o.llegada ??= t;
  if (a.evento === "resultado") {
    o.cierre = t; o.resultado = a.resultado; o.motivoResultado = a.motivo ?? null;
    if (a.resultado === "resuelto") o.finalizada = t;
    else o.notas.push({ id: a.id, at: t, autorId: a.personaId, tipo: "novedad", texto: RESULTADOS[a.resultado].label + (a.motivo ? `: ${a.motivo}` : "") });
  }
  o.eventos.push({ tipo: a.evento === "resultado" ? a.resultado : a.evento, at: t, ...meta });
  o.ultimaNovedad = Math.max(o.ultimaNovedad ?? 0, t);
  return { ok: true };
}

// Ubicación: una sola lectura en el momento del toque, nunca seguimiento.
function pedirUbicacion(id) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition((p) => {
    const a = S.cola.find((x) => x.id === id);
    if (a) { a.ubic = { lat: +p.coords.latitude.toFixed(5), lng: +p.coords.longitude.toFixed(5), precision: Math.round(p.coords.accuracy) }; guardar(); }
  }, () => {}, { timeout: 8000, maximumAge: 60000, enableHighAccuracy: false });
}

function sincronizar() {
  if (!S.online || enviando) return;
  const listas = [];
  for (const a of S.cola) { if (a.listoDesde > ahora()) break; listas.push(a); } // orden estricto
  if (!listas.length) return;
  enviando = true; render();
  setTimeout(() => {
    const procesados = new Set(S.procesados ?? []);
    for (const a of listas) {
      if (procesados.has(a.id)) continue; // idempotencia: el mismo ID nunca se aplica dos veces
      const r = aplicarAccion(S, a, true);
      procesados.add(a.id);
      S.ultimaRecepcion = ahora();
      if (!r.ok) { avisar(a.personaId, r.motivo, "rechazo"); if (a.personaId === S.sesion) sonar("error"); continue; }
      if (a.offline) hito("sync");
      if (a.tipo === "fichar" && a.fichaje === "entrada") hito("turno");
      if (a.evento === "visto") hito("visto");
      if (a.evento === "en_sitio" && a.offline) hito("sinSenal");
      if (a.evento === "resultado") hito("decision");
      const quien = corto(a.personaId);
      if (a.tipo === "fichar") toast(`${a.personas?.length > 1 ? a.personas.map(corto).join(" y ") : quien} ${a.fichaje === "entrada" ? (a.personas?.length > 1 ? "comenzaron" : "comenzó") + " el turno" : "finalizó el turno"}`, a.at);
      else {
        const o = S.ordenes.find((x) => x.id === a.ordenId);
        flash[a.ordenId] = ahora() + 2600;
        const txt = a.evento === "resultado" ? RESULTADOS[a.resultado].label.toLowerCase() : a.evento === "nota" || a.evento === "novedad" ? `“${a.texto}”` : a.evento === "foto" ? "subió una foto" : EVENTO_LABEL[a.evento].toLowerCase();
        toast(`OT-${o?.numero}: ${txt} (${quien})`, a.at);
      }
    }
    S.procesados = [...procesados].slice(-500);
    const ids = new Set(listas.map((a) => a.id));
    S.cola = S.cola.filter((a) => !ids.has(a.id));
    enviando = false; guardar(); render();
  }, 700);
}

  toasts.push({ id: uid(), texto: texto + tarde, hasta: ahora() + 4500 });
  renderToasts();
}

        <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".4"/></svg></span>
    </div>`;
}

function contextoCelu() {
  const yo = S.personas.find((p) => p.id === S.sesion);
  const v = vistaCelu();
  const turno = v.fichajes.find((f) => f.personaId === yo.id && !f.salida);
  const minHoy = v.fichajes.filter((f) => f.personaId === yo.id && f.salida && f.entrada >= inicioDia()).reduce((s, f) => s + (f.salida - f.entrada) / MIN, 0);
  const enCurso = (o) => (o.estado === "en_camino" || o.estado === "en_sitio" ? 1 : 0);
  const mias = v.ordenes.filter((o) => o.asignados.includes(yo.id) && (ACTIVOS.includes(o.estado) || o.estado === "bloqueada"));
  const activas = mias.filter((o) => o.estado !== "bloqueada")
    .sort((a, b) => enCurso(b) - enCurso(a) || URG[b.urgencia].peso - URG[a.urgencia].peso || (a.horario ?? a.creada) - (b.horario ?? b.creada));
  const nuevas = activas.filter((o) => o.liderId === yo.id && !o.visto);
  const actual = activas.find((o) => o.id === S.elegida) ?? activas.find((o) => o.visto || o.liderId !== yo.id) ?? null;
  const resto = activas.filter((o) => o !== actual && !nuevas.includes(o));
  const esperando = mias.filter((o) => o.estado === "bloqueada");
  const cola = S.cola.filter((a) => a.personaId === yo.id);
  const avisos = S.avisos.filter((x) => x.personaId === yo.id && !x.leido && (S.online || x.at <= S.offlineDesde));
  return { yo, v, turno, minHoy, activas, nuevas, actual, resto, esperando, cola, avisos, p: pref() };
}

function indicadorSync(c) {
  const n = c.cola.length, rechazos = c.avisos.filter((x) => x.tipo === "rechazo").length;
  if (rechazos) return `<span class="inline-flex items-center gap-1.5 rounded-full bg-peligro px-2.5 py-1 text-[15px] font-bold text-white">${ic("alerta", "size-4")} Revisar ${rechazos}</span>`;
  if (n && !S.online) return `<span class="inline-flex items-center gap-1.5 rounded-full bg-black px-2.5 py-1 text-[15px] font-bold text-white">${ic("nube", "size-4")} ${n} en el celu, sin enviar</span>`;
  if (n) return `<span class="inline-flex items-center gap-1.5 rounded-full bg-black px-2.5 py-1 text-[15px] font-bold text-white">${ic("girar", `size-4 ${enviando ? "girar" : ""}`)} ${n} por enviar</span>`;
  if (!S.online) return `<span class="inline-flex items-center gap-1.5 rounded-full border-2 border-black px-2.5 py-0.5 text-[15px] font-bold">${ic("sinwifi", "size-4")} Sin señal, todo enviado</span>`;
  return `<span class="inline-flex items-center gap-1.5 rounded-full border-2 border-black px-2.5 py-0.5 text-[15px] font-bold">${ic("check", "size-4", 3)} Todo enviado${S.ultimaRecepcion ? ` ${hora(S.ultimaRecepcion)}` : ""}</span>`;
}

function renderCelu() {
  renderBarraEstado();
  const el = $("#celu"), ov = $("#celu-overlay");
  if (!S.sesion) { el.innerHTML = pantallaLogin(); ov.innerHTML = ""; return; }
  const c = contextoCelu();
  const z = c.p.guantes ? "guantes" : "";

  el.innerHTML = `
  <main class="flex flex-col gap-4 px-4 pb-[330px] pt-3 ${z}">
    <header class="flex items-center gap-3">
      <div class="min-w-0 flex-1">
        <p class="semi truncate text-[22px] font-extrabold leading-tight">${esc(c.yo.nombre)}</p>
        <div class="mt-1">${indicadorSync(c)}</div>
      </div>
      <button data-a="hoja" data-v="menu" aria-label="Menú" class="grid size-14 shrink-0 place-items-center rounded-2xl border-[3px] border-black active:bg-black active:text-white">${ic("menu", "size-7", 3)}</button>
    </header>
    ${c.avisos.map(tarjetaAviso).join("")}
    ${c.nuevas.map(tarjetaNueva).join("")}
    ${lineaTurno(c)}
    ${c.actual ? tarjetaOrden(c.actual, c) : c.nuevas.length ? "" : `
      <section class="rounded-[28px] border-[3px] border-dashed border-black/40 px-6 py-10 text-center">
        <p class="semi text-2xl font-extrabold">Sin órdenes asignadas</p>
        <p class="mt-1 text-lg">Cuando te asignen una, el celular avisa.</p>
      </section>`}
    ${c.esperando.map((o) => `<p class="rounded-2xl border-[3px] border-black p-4 text-lg"><b>OT-${o.numero} ${esc(o.direccion)}</b>: esperando decisión de la oficina (${esc(RESULTADOS[o.resultado]?.label.toLowerCase() ?? "")}).</p>`).join("")}
    ${c.resto.length ? `
      <section><h2 class="semi mb-2 text-xl font-extrabold">Después</h2>
        <ul class="flex flex-col gap-2">${c.resto.map((o) => `
          <li><button data-a="elegir" data-id="${o.id}" class="flex min-h-16 w-full items-stretch overflow-hidden rounded-2xl border-[3px] border-black text-left active:bg-black active:text-white">
            <span class="w-2.5 shrink-0 ${o.urgencia === "emergencia" ? "rayas" : URG[o.urgencia].barra}"></span>
            <span class="min-w-0 flex-1 px-3 py-2"><span class="cond block truncate text-[26px] font-extrabold leading-tight">${esc(o.direccion)}</span>
            <span class="block truncate text-lg">${esc(tipoTexto(o))}${o.horario ? `, ${hora(o.horario)} h` : ""}</span></span>
          </button></li>`).join("")}</ul>
      </section>` : ""}
  </main>`;

  ov.innerHTML = `<div class="fixed inset-x-0 bottom-0 z-30 lg:absolute ${z}">${barraDeshacer(c)}${botonera(c)}</div>${hojaHTML(c)}`;
}

function tarjetaAviso(x) {
  const rojo = x.tipo === "rechazo" || x.tipo === "cancelada";
  return `<section class="entrar rounded-[24px] border-[3px] ${rojo ? "border-peligro" : "border-black"} bg-white p-4">
    <p class="flex gap-2 text-lg font-bold leading-snug">${ic(rojo ? "alerta" : "nota", `mt-0.5 size-6 shrink-0 ${rojo ? "text-peligro" : ""}`)}${esc(x.texto)}</p>
    <button data-a="entendido" data-id="${x.id}" class="mt-3 h-14 w-full rounded-2xl bg-black text-xl font-extrabold text-white">Entendido</button></section>`;
}

function tarjetaNueva(o) {
  const em = o.urgencia === "emergencia";
  return `<section class="entrar overflow-hidden rounded-[28px] bg-black text-white">
    ${em ? `<div class="rayas h-3"></div>` : ""}
    <div class="p-5">
      <p class="flex items-center gap-2 text-lg font-bold ${em ? "text-[#FF8A80]" : "text-senal"}">${ic("alerta", "size-5")} ${em ? "Nueva emergencia" : "Nueva orden"} · OT-${o.numero}</p>
      <p class="cond mt-1 text-[44px] font-extrabold leading-[.95]">${esc(o.direccion)}</p>
      <p class="mt-1 text-xl">${esc(tipoTexto(o))}</p>
      <button data-a="recibido" data-id="${o.id}" class="mt-4 flex h-16 w-full items-center justify-center gap-2 rounded-2xl bg-white text-[22px] font-extrabold text-black">${ic("check", "size-7", 3)} Recibido</button>
    </div></section>`;
}

function lineaTurno(c) {
  if (!c.turno) return c.minHoy > 0 ? `<p class="text-lg">Fuera de turno. Hoy trabajaste <b>${dur(c.minHoy)}</b>.</p>` : "";
  const enCurso = (ahora() - c.turno.entrada) / MIN;
  const olvidado = enCurso > S.config.turnoAbiertoH * 60;
  const pidio = S.solicitudes.some((s) => s.personaId === c.yo.id && s.estado === "pendiente");
  return `
    ${olvidado ? `<section class="rounded-[24px] border-[3px] border-black bg-senal p-4 text-black">
      <p class="text-lg font-bold leading-snug">Tu turno sigue abierto desde el ${fechaHora(c.turno.entrada)}. ¿Te olvidaste de fichar la salida?</p>
      ${pidio ? `<p class="mt-2 text-lg">Ya avisaste a la oficina: ellos lo corrigen.</p>` : `<button data-a="solicitud" data-v="Olvidé fichar la salida" class="mt-3 h-14 w-full rounded-2xl bg-black text-xl font-extrabold text-white">Avisar a la oficina</button>`}
    </section>` : ""}
    <section class="flex items-center gap-3 rounded-[24px] bg-black p-2 pl-4 text-white">
      <div class="min-w-0 flex-1">
        <p class="flex items-center gap-2 whitespace-nowrap text-[17px] font-semibold"><span class="latido size-3 shrink-0 rounded-full bg-[#3BE08A]"></span>En turno</p>
        <p class="cond num whitespace-nowrap text-[38px] font-extrabold leading-none">${reloj(enCurso)} h</p>
        <p class="num whitespace-nowrap text-base">desde ${olvidado ? fechaHora(c.turno.entrada) : hora(c.turno.entrada)}</p>
      </div>
      <button data-a="fichar" data-v="salida" class="flex h-16 shrink-0 items-center gap-2 rounded-[18px] bg-white px-4 text-[19px] font-extrabold text-black active:bg-slate-200">${ic("stop", "size-5 fill-black")} Fichar salida</button>
    </section>`;
}

function tarjetaOrden(o, c) {
  const u = URG[o.urgencia], esLider = o.liderId === c.yo.id, em = o.urgencia === "emergencia";
  const estado = o.estado === "pendiente" ? `Asignada a las ${hora(o.creada)}${o.horario ? `, prevista ${hora(o.horario)}` : ""}`
    : o.estado === "en_camino" ? `En camino desde las ${hora(o.enCamino)}` : `En el lugar desde las ${hora(o.llegada)}`;
  const navPref = c.p.nav;
  const ultimas = o.notas.slice(-2).reverse();
  return `
  <section class="overflow-hidden rounded-[28px] border-[3px] border-black">
    ${em ? `<div class="rayas h-3"></div>` : ""}
    <div class="flex items-center justify-between px-5 py-2.5 ${u.clase}">
      <span class="semi text-xl font-extrabold">${em ? "Emergencia" : `Urgencia ${u.label.toLowerCase()}`}</span>
      <span class="num text-lg font-bold">OT-${o.numero}</span>
    </div>
    <div class="flex flex-col gap-4 p-5">
      <div>
        <p class="text-lg font-semibold">${esc(tipoTexto(o))}</p>
        <p class="cond mt-1 text-[48px] font-extrabold leading-[.95] tracking-tight">${esc(o.direccion)}</p>
        ${o.referencia ? `<p class="mt-2 text-xl leading-snug">${esc(o.referencia)}</p>` : ""}
        <p class="mt-3 text-xl font-bold">${estado}</p>
      </div>
      ${o.descripcion ? `<div class="rounded-2xl border-2 border-black p-3"><p class="text-base font-bold">Trabajo a realizar</p><p class="text-xl leading-snug">${esc(o.descripcion)}</p></div>` : ""}
      <div class="grid ${o.telefono ? "grid-cols-2" : "grid-cols-1"} gap-2">
        ${navPref ? `<a href="${linkNav(o, navPref)}" target="_blank" rel="noopener" class="flex h-16 items-center justify-center gap-2 whitespace-nowrap rounded-2xl bg-black px-2 text-[19px] font-extrabold text-white">${ic("nav", "size-5 shrink-0")} Cómo llegar</a>`
          : `<button data-a="hoja" data-v="nav" class="flex h-16 items-center justify-center gap-2 whitespace-nowrap rounded-2xl bg-black px-2 text-[19px] font-extrabold text-white">${ic("nav", "size-5 shrink-0")} Cómo llegar</button>`}
        ${o.telefono ? `<a href="tel:${esc(o.telefono.replace(/\s/g, ""))}" class="flex h-16 items-center justify-center gap-2 whitespace-nowrap rounded-2xl border-[3px] border-black px-2 text-[19px] font-extrabold">${ic("tel", "size-5 shrink-0")} Llamar</a>` : ""}
      </div>
      <div class="grid grid-cols-3 gap-2">
        <label class="relative flex h-16 cursor-pointer flex-col items-center justify-center rounded-2xl border-[3px] border-black text-[17px] font-bold active:bg-black active:text-white">${ic("camara", "size-6")} Foto
          <input type="file" accept="image/*" capture="environment" class="ocultar-input" data-foto="trabajo" data-id="${o.id}"></label>
        <button data-a="hoja" data-v="nota" class="flex h-16 flex-col items-center justify-center rounded-2xl border-[3px] border-black text-[17px] font-bold active:bg-black active:text-white">${ic("mic", "size-6")} Nota</button>
        <button data-a="hoja" data-v="problema" class="flex h-16 flex-col items-center justify-center rounded-2xl border-[3px] border-black text-[17px] font-bold active:bg-black active:text-white">${ic("alerta", "size-6")} Avisar</button>
      </div>
      ${ultimas.length ? `<ul class="flex flex-col gap-1 text-lg">${ultimas.map((n) => `<li><b class="num">${hora(n.at)}</b> ${esc(corto(n.autorId))}: ${esc(n.texto)}</li>`).join("")}</ul>` : ""}
      ${o.fotos.length ? `<p class="text-lg">${o.fotos.length} foto${o.fotos.length > 1 ? "s" : ""} cargada${o.fotos.length > 1 ? "s" : ""}</p>` : ""}
      <p class="text-lg">Equipo: ${o.asignados.map((id) => `${esc(corto(id))}${id === o.liderId ? " (líder)" : ""}`).join(", ")}</p>
      ${esLider ? "" : `<p class="rounded-2xl bg-black p-4 text-lg text-white"><b>${esc(nombreDe(o.liderId))}</b> lleva el registro de la orden. Vos podés sumar fotos, notas y problemas.</p>`}
    </div>
  </section>`;
}

const linkNav = (o, app) => {
  const q = encodeURIComponent(S.config.ciudad ? `${o.direccion}, ${S.config.ciudad}` : o.direccion);
  return app === "waze" ? `https://waze.com/ul?q=${q}&navigate=yes` : `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${q}`;
};

// Botonera fija abajo: siempre la próxima acción, nada más
function botonera(c) {
  const pasa = bloqueoHasta - ahora();
  const col = c.p.colores;
  const grande = (accion, attrs, texto, icono, color) =>
    `<button data-a="${accion}" ${attrs} class="flex h-[84px] w-full items-center gap-4 rounded-[24px] px-5 text-left ${col ? color : "bg-black text-white"} active:scale-[.99]">
      <span class="grid size-14 shrink-0 place-items-center rounded-full ${col ? "bg-black/15" : "bg-white text-black"}">${ic(icono, "size-8", 2.8)}</span>
      <span class="cond text-[34px] font-extrabold leading-none">${texto}</span></button>`;
  let cuerpo = "";
  if (pasa > 0) {
    cuerpo = `<button disabled class="flex h-[84px] w-full items-center justify-center gap-3 rounded-[24px] border-[3px] border-black bg-white text-[26px] font-extrabold text-black">${ic("check", "size-8", 3)} Registrado · ${Math.ceil(pasa / 1000)}</button>`;
  } else if (!c.turno) {
    cuerpo = grande("fichar", `data-v="entrada"`, "Fichar entrada", "play", "bg-black text-white");
  } else if (c.actual && c.actual.liderId === c.yo.id) {
    const o = c.actual;
    if (o.estado === "pendiente") cuerpo = grande("evento", `data-id="${o.id}" data-v="en_camino"`, "Salimos hacia el lugar", "camion", "bg-agua text-white");
    else if (o.estado === "en_camino") cuerpo = grande("evento", `data-id="${o.id}" data-v="en_sitio"`, "Llegué al lugar", "pin", "bg-senal text-black");
    else if (o.estado === "en_sitio") {
      const tipoKey = o.tipo in TIPOS ? o.tipo : "otro";
      const pideFoto = S.config.fotoObligatoria[tipoKey] && !o.fotos.some((f) => f.momento === "final");
      const resuelto = pideFoto
        ? `<label class="flex h-[84px] w-full cursor-pointer items-center gap-4 rounded-[24px] px-5 ${col ? "bg-ok text-white" : "bg-black text-white"}">
            <span class="grid size-14 shrink-0 place-items-center rounded-full ${col ? "bg-black/15" : "bg-white text-black"}">${ic("camara", "size-8", 2.6)}</span>
            <span><span class="cond block text-[34px] font-extrabold leading-none">Foto y resuelto</span><span class="block text-base">Este trabajo pide foto final</span></span>
            <input type="file" accept="image/*" capture="environment" class="ocultar-input" data-foto="final" data-id="${o.id}"></label>`
        : grande("resultado", `data-id="${o.id}" data-v="resuelto"`, "Resuelto", "check", "bg-ok text-white");
      cuerpo = `${resuelto}
        <div class="mt-2 grid grid-cols-2 gap-2">
          <button data-a="resultado" data-id="${o.id}" data-v="no_se_pudo" class="h-16 rounded-[20px] border-[3px] border-black bg-white text-[20px] font-extrabold leading-tight text-black">No se pudo</button>
          <button data-a="resultado" data-id="${o.id}" data-v="falta_repuesto" class="h-16 rounded-[20px] border-[3px] border-black bg-white text-[20px] font-extrabold leading-tight text-black">Falta repuesto</button>
        </div>`;
    }
  }
  return cuerpo ? `<div class="border-t-[3px] border-black bg-white p-3 pb-[max(.75rem,env(safe-area-inset-bottom))]">${cuerpo}</div>` : "";
}

function barraDeshacer(c) {
  if (!deshacible) return "";
  const a = S.cola.find((x) => x.id === deshacible.id);
  if (!a) { deshacible = null; return ""; }
  const pasado = ahora() - deshacible.desde;
  const chip = (accion, v, txt, activo) => `<button data-a="${accion}" data-v="${esc(v)}" class="h-12 shrink-0 rounded-full border-2 border-white px-3.5 text-[17px] font-bold ${activo ? "bg-white text-black" : ""}">${txt}</button>`;
  let extra = "";
  if (ES_HORA(a)) {
    const sel = a.atDeclarada != null ? Math.round((a.at - a.atDeclarada) / MIN) : 0;
    extra += `<div class="flex items-center gap-2 overflow-x-auto px-4 pb-2 sin-barra"><span class="shrink-0 text-[17px]">¿Fue antes?</span>${[5, 10, 20].map((m) => chip("fueHace", m, `Hace ${m} min`, sel === m)).join("")}</div>`;
  }
  if (a.tipo === "fichar" && a.fichaje === "entrada") {
    const comp = equipoSinFichar(c);
    if (comp.length) extra += `<div class="px-4 pb-2">${chip("ficharEquipo", "1", a.personas?.length > 1 ? `✓ También ${comp.map(corto).join(" y ")}` : `Fichar también a ${comp.map(corto).join(" y ")}`, a.personas?.length > 1)}</div>`;
  }
  if (a.evento === "resultado" && a.resultado === "no_se_pudo")
    extra += `<div class="flex gap-2 overflow-x-auto px-4 pb-2 sin-barra">${MOTIVOS_NO_SE_PUDO.map((m) => chip("motivo", m, m, a.motivo === m)).join("")}</div>`;
  const cuando = a.atDeclarada ?? a.at;
  return `<div class="entrar bg-black text-white">
    <div class="h-1.5 origin-left bg-senal" style="animation: encoger ${GRACIA}ms linear forwards; animation-delay: -${pasado}ms"></div>
    <div class="flex items-center justify-between gap-3 px-4 py-2.5">
      <p class="min-w-0 text-[19px] font-extrabold leading-tight">${ic("check", "mr-1 inline size-5 align-[-3px] text-senal", 3)}${esc(deshacible.label)}${ES_HORA(a) ? ` <span class="num font-semibold">${hora(cuando)}</span>` : ""}</p>
      <button data-a="deshacer" class="flex h-14 shrink-0 items-center gap-2 rounded-full bg-white px-5 text-lg font-extrabold text-black">${ic("deshacer", "size-5")} Deshacer</button>
    </div>${extra}</div>`;
}

function equipoSinFichar(c) {
  const o = c.v.ordenes.find((x) => x.liderId === c.yo.id && ACTIVOS.includes(x.estado));
  const cua = S.cuadrillas.find((q) => q.miembros.includes(c.yo.id));
  const ids = new Set([...(o?.asignados ?? []), ...(cua?.miembros ?? [])]);
  ids.delete(c.yo.id);
  return [...ids].filter((pid) => !c.v.fichajes.some((f) => f.personaId === pid && !f.salida));
}

// Hojas que suben desde abajo (nota, problema, menú, navegación)
function hojaHTML(c) {
  if (!hoja) return "";
  const o = c.actual;
  const fila = (txt, accion, v, id = "") => `<button data-a="${accion}" data-v="${esc(v)}" ${id ? `data-id="${id}"` : ""} class="min-h-16 w-full rounded-2xl border-[3px] border-black px-4 py-3 text-left text-[20px] font-bold active:bg-black active:text-white">${txt}</button>`;
  let titulo = "", cuerpo = "";
  if (hoja === "nota" && o) {
    titulo = "Nota para la oficina";
    const escuchando = !!dictado;
    cuerpo = `
      <button data-a="dictar" data-id="${o.id}" class="flex h-24 w-full items-center justify-center gap-3 rounded-[24px] ${escuchando ? "bg-peligro" : "bg-black"} text-[26px] font-extrabold text-white">
        ${ic("mic", `size-9 ${escuchando ? "latido" : ""}`, 2.6)} ${escuchando ? "Escuchando… tocá para terminar" : "Tocá y hablá"}</button>
      ${dictado?.texto ? `<p class="rounded-2xl bg-papel p-3 text-xl">${esc(dictado.texto)}</p>` : ""}
      ${avisoVoz ? `<p class="rounded-2xl border-[3px] border-black p-3 text-lg font-bold">${esc(avisoVoz)}</p>` : ""}
      <p class="pt-1 text-lg font-bold">O tocá una (se guarda sola):</p>
      <div class="grid grid-cols-2 gap-2">${NOTAS_RAPIDAS.map((n) => `<button data-a="notaRapida" data-id="${o.id}" data-v="${esc(n)}" class="min-h-16 rounded-2xl border-[3px] border-black px-2 text-[19px] font-bold leading-tight active:bg-black active:text-white">${n}</button>`).join("")}</div>
      ${escribiendo ? `<textarea id="nota-texto" data-nota="1" rows="3" maxlength="500" class="w-full rounded-2xl border-[3px] border-black p-3 text-xl outline-none focus:border-agua" placeholder="Escribí la nota">${esc(textoNota)}</textarea>
        <button data-a="guardarTexto" data-id="${o.id}" class="h-16 w-full rounded-2xl bg-black text-xl font-extrabold text-white">Guardar nota</button>`

function alertas() {
  const t = ahora(), c = S.config, L = [];
  const otros = (o) => o.asignados.filter((p) => p !== o.liderId);
  const pasarA = (o) => otros(o).map((p) => btnChico("lider", `data-id="${o.id}" data-v="${p}"`, `Pasar el liderazgo a ${corto(p)}`)).join("");
  for (const o of S.ordenes) {
    if (o.urgencia === "emergencia" && o.estado === "pendiente" && !o.visto && t - o.creada > c.alertaEmergenciaMin * MIN)
      L.push({ nivel: 3, color: "border-peligro", texto: `Emergencia OT-${o.numero} sin acusar recibo hace ${dur((t - o.creada) / MIN)}`, sub: `${o.direccion}. Líder: ${nombreDe(o.liderId)}.`, acciones: pasarA(o) + btnChico("detalle", `data-id="${o.id}"`, "Ver") });
    if (o.estado === "bloqueada")
      L.push({ nivel: 2, color: "border-naranja", texto: `OT-${o.numero}: ${RESULTADOS[o.resultado]?.label.toLowerCase()}`, sub: `${o.direccion}${o.motivoResultado ? `. ${o.motivoResultado}` : ""}. Informó ${corto(o.liderId)} a las ${hora(o.cierre)}.`,
        acciones: btnChico("reprogramar", `data-id="${o.id}" data-v="Llegó el repuesto"`, "Reprogramar", "bg-tinta text-white") + btnChico("cerrarSin", `data-id="${o.id}"`, "Cerrar sin resolver") + btnChico("detalle", `data-id="${o.id}"`, "Ver") });
    if (o.novedad && ACTIVOS.includes(o.estado))
      L.push({ nivel: 2, color: "border-naranja", texto: `${corto(o.novedad.autorId)} avisa: ${o.novedad.texto}`, sub: `OT-${o.numero}, ${o.direccion}, a las ${hora(o.novedad.at)}.`, acciones: btnChico("novedadVista", `data-id="${o.id}"`, "Visto, lo resolvemos", "bg-tinta text-white") + btnChico("detalle", `data-id="${o.id}"`, "Ver") });
    if ((o.estado === "en_camino" || o.estado === "en_sitio") && t - (o.ultimaNovedad ?? o.creada) > c.alertaSinNovedadMin * MIN)
      L.push({ nivel: 1, color: "border-senal", texto: `OT-${o.numero} sin novedades hace ${dur((t - (o.ultimaNovedad ?? o.creada)) / MIN)}`, sub: `${EST[o.estado].label} en ${o.direccion}. Líder: ${nombreDe(o.liderId)}.`, acciones: btnChico("detalle", `data-id="${o.id}"`, "Ver orden") });
  }
  if (!S.online && S.sesion && S.offlineDesde && t - S.offlineDesde > c.alertaSinConexionMin * MIN) {
    const lidera = S.ordenes.filter((o) => o.liderId === S.sesion && ACTIVOS.includes(o.estado));
    L.push({ nivel: 3, color: "border-peligro", texto: `El celular de ${nombreDe(S.sesion)} no se conecta desde las ${hora(S.offlineDesde)}`, sub: `Lo que registre sin señal llega cuando la recupere.${lidera.length ? ` Lidera ${lidera.map((o) => `OT-${o.numero}`).join(", ")}.` : ""}`, acciones: lidera.map(pasarA).join("") });
  }
  for (const f of S.fichajes.filter((f) => !f.salida && t - f.entrada > c.turnoAbiertoH * 60 * MIN))
    L.push({ nivel: 2, color: "border-naranja", texto: `Turno de ${nombreDe(f.personaId)} abierto desde ${fechaHora(f.entrada)}`, sub: "Probablemente se olvidó de fichar la salida. Proponé un cierre y quedará registrado quién y por qué.", acciones: btnChico("corregirFichaje", `data-id="${f.id}"`, "Cerrar el turno", "bg-tinta text-white") });
  for (const s of S.solicitudes.filter((s) => s.estado === "pendiente")) {
    const f = S.fichajes.filter((x) => x.personaId === s.personaId).sort((a, b) => b.entrada - a.entrada)[0];
    L.push({ nivel: 2, color: "border-agua", texto: `${nombreDe(s.personaId)} pide corrección: ${s.texto.toLowerCase()}`, sub: `Pedido a las ${hora(s.at)}.`, acciones: btnChico("corregirFichaje", `data-id="${f?.id ?? ""}" data-v="${s.id}" data-p="${s.personaId}"`, "Corregir", "bg-tinta text-white") + btnChico("solicitudLista", `data-id="${s.id}"`, "No hace falta") });
  }
  return L.sort((a, b) => b.nivel - a.nivel);
}

// ---------- Reportes ----------
function rangoActual() {
  const hoy = inicioDia(), d = new Date(hoy), r = S.rango;
  if (r.tipo === "mes") return { desde: new Date(d.getFullYear(), d.getMonth(), 1).getTime(), hasta: hoy + DIA };
  if (r.tipo === "7d") return { desde: hoy - 6 * DIA, hasta: hoy + DIA };
  if (r.tipo === "custom" && r.desde && r.hasta) return { desde: new Date(`${r.desde}T00:00`).getTime(), hasta: new Date(`${r.hasta}T00:00`).getTime() + DIA };
  const ini = d.getDate() <= 15 ? 1 : 16;
  return { desde: new Date(d.getFullYear(), d.getMonth(), ini).getTime(), hasta: hoy + DIA };
}

function solape(a, b, c, d) { return Math.max(0, Math.min(b, d) - Math.max(a, c)); }
function minutosNocturnos(ent, sal) {
  const c = S.config, ini = horaMin(c.nocheDesde), fin = horaMin(c.nocheHasta);
  let total = 0;
  for (let dia = inicioDia(ent) - DIA; dia <= sal; dia += DIA) {
    const a = dia + ini * MIN, b = ini > fin ? dia + DIA + fin * MIN : dia + fin * MIN;
    total += solape(ent, sal, a, b);
  }
  return total / MIN;
}

function datosHoras() {
  const { desde, hasta } = rangoActual(), c = S.config, t = ahora();
  const feriados = new Set(String(c.feriados).split(/[\s,;]+/).filter(Boolean));
  const porDia = new Map();
  for (const f of S.fichajes.filter((f) => f.entrada >= desde && f.entrada < hasta)) {
    const k = `${f.personaId}|${inicioDia(f.entrada)}`;
    const d = porDia.get(k) ?? { personaId: f.personaId, fecha: inicioDia(f.entrada), fichajes: [], bruto: 0, noche: 0, abierto: false, corregido: false };
    // un turno olvidado no suma horas inventadas: cuenta 0 hasta que la oficina lo corrija
    const fin = f.salida ?? (t - f.entrada > c.turnoAbiertoH * 60 * MIN ? f.entrada : t);
    d.fichajes.push(f); d.bruto += (fin - f.entrada) / MIN; d.noche += minutosNocturnos(f.entrada, fin);
    d.abierto ||= !f.salida; d.corregido ||= !!f.correccion;
    porDia.set(k, d);
  }
  const dias = [...porDia.values()].map((d) => {
    const neto = d.bruto - (d.bruto >= c.almuerzoDesdeH * 60 ? c.almuerzoMin : 0);
    const dow = new Date(d.fecha).getDay(), especial = dow === 0 || dow === 6 || feriados.has(iso(d.fecha));
    const normales = especial ? 0 : Math.min(neto, c.jornadaH * 60), extra = especial ? 0 : Math.max(0, neto - c.jornadaH * 60);
    return { ...d, neto, normales, extra, finde: especial ? neto : 0, especial };
  }).sort((a, b) => nombreDe(a.personaId).localeCompare(nombreDe(b.personaId)) || a.fecha - b.fecha);
  const tot = new Map();
  for (const d of dias) {
    const x = tot.get(d.personaId) ?? { personaId: d.personaId, dias: 0, normales: 0, extra: 0, noche: 0, finde: 0, total: 0, abiertos: 0, corregidos: 0 };
    x.dias++; x.normales += d.normales; x.extra += d.extra; x.noche += d.noche; x.finde += d.finde; x.total += d.neto; x.abiertos += d.abierto ? 1 : 0; x.corregidos += d.corregido ? 1 : 0;
    tot.set(d.personaId, x);
  }
  const totales = [...tot.values()].map((x) => {
    const motivos = [];
    if (x.abiertos) motivos.push("turno sin cerrar");
    if (S.solicitudes.some((s) => s.personaId === x.personaId && s.estado === "pendiente")) motivos.push("corrección pedida");
    if (S.cola.some((a) => a.personaId === x.personaId && a.tipo === "fichar")) motivos.push("fichajes sin enviar desde su celular");
    return { ...x, provisorio: motivos };
  }).sort((a, b) => nombreDe(a.personaId).localeCompare(nombreDe(b.personaId)));
  return { desde, hasta, dias, totales };
}

function datosOrdenes() {
  const { desde, hasta } = rangoActual();
  const todas = S.ordenes.filter((o) => o.creada >= desde && o.creada < hasta).sort((a, b) => b.creada - a.creada);
  const norm = (s) => s.toLowerCase().replace(/\s+/g, " ").trim();
  const conteo = new Map();
  todas.forEach((o) => conteo.set(norm(o.direccion), (conteo.get(norm(o.direccion)) ?? 0) + 1));
  const q = norm(busqueda);
  const lista = q ? todas.filter((o) => norm(o.direccion).includes(q) || String(o.numero).includes(q)) : todas;
  const m = (a, b) => (a && b ? (b - a) / MIN : null);
  return { todas, lista, repetidas: (o) => conteo.get(norm(o.direccion)), tiempos: (o) => ({ as: m(o.creada, o.enCamino), sl: m(o.enCamino, o.llegada), lr: m(o.llegada, o.finalizada) }) };
}

function entrar(p) {

const tocarPrincipal = () => { if (bloqueoHasta > ahora()) return false; bloqueoHasta = ahora() + BLOQUEO; return true; };

function descargarCSV(nombre, enc, filas) {
  const c = (v) => { if (v == null) return ""; const s = typeof v === "number" ? String(Math.round(v * 100) / 100).replace(".", ",") : String(v); return /[";\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const txt = "﻿" + [enc, ...filas].map((f) => f.map(c).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" }));
  a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function cambiarLider(oid, pid, motivo) {
  const o = S.ordenes.find((x) => x.id === oid);
  if (!o || o.liderId === pid) return;
  const ant = o.liderId;
  o.liderId = pid; if (!o.asignados.includes(pid)) o.asignados.push(pid);
  auditar(`Pasó el liderazgo de OT-${o.numero} de ${nombreDe(ant)} a ${nombreDe(pid)}`, motivo, { ordenId: oid });
  avisar(ant, `Ya no sos líder de la OT-${o.numero}. Ahora registra ${nombreDe(pid)}.`, "reasignada");
  avisar(pid, `Ahora sos líder de la OT-${o.numero} (${o.direccion}). Registrá el avance desde tu celular.`, "reasignada");
  flash[oid] = ahora() + 2600;
  toast(`OT-${o.numero}: ahora la lidera ${nombreDe(pid)}`);
}

async function cargarFoto(input) {
  const file = input.files?.[0]; if (!file) return;
  const ordenId = input.dataset.id, momento = input.dataset.foto;
  try {
    const data = await comprimir(file), fotoId = uid();
    await fotosDB.put(fotoId, data);
    if (momento === "final") {
      encolar({ tipo: "evento", ordenId, evento: "foto", fotoId, momento }, "Foto guardada", { deshacer: false });
      if (tocarPrincipal()) encolar({ tipo: "evento", ordenId, evento: "resultado", resultado: "resuelto" }, "Resuelto");
    } else encolar({ tipo: "evento", ordenId, evento: "foto", fotoId, momento }, "Foto guardada");
  } catch { avisar(S.sesion, "No se pudo guardar la foto en el celular. Probá de nuevo.", "rechazo"); render(); }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function dictar(ordenId) {
  if (dictado) { dictado.r.stop(); return; }
  avisoVoz = "";
  if (!SR) { avisoVoz = "Este celular no permite dictar. Usá un botón o escribí."; escribiendo = true; render(); return; }
  if (!S.online || !navigator.onLine) { avisoVoz = "El dictado necesita señal. Usá un botón; se guarda igual sin señal."; render(); return; }
  const r = new SR(); r.lang = "es-AR"; r.interimResults = true; r.maxAlternatives = 1;
  dictado = { ordenId, texto: "", r };
  r.onresult = (e) => { if (!dictado) return; dictado.texto = [...e.results].map((x) => x[0].transcript).join(" "); render(); };
  r.onerror = (e) => { avisoVoz = e.error === "not-allowed" ? "Permití el micrófono para dictar notas." : "No se entendió. Probá de nuevo o tocá un botón."; };
  r.onend = () => { const t = dictado?.texto.trim(); dictado = null; if (t) { hoja = null; encolar({ tipo: "evento", ordenId, evento: "nota", texto: t }, "Nota guardada"); } else render(); };
  try { r.start(); sonar("ok"); } catch { dictado = null; avisoVoz = "No se pudo usar el micrófono."; }
  render();
}

    horario: loc(o.horario), descripcion: o.descripcion, cuadrilla: o.cuadrillaId ?? "", asignados: [...o.asignados], lider: o.liderId };
  cajon = { tipo: "orden" }; render();
}

    auditar(`Canceló OT-${o.numero} (${o.direccion})`, cajon.motivo, { ordenId: o.id });
    o.asignados.forEach((p) => avisar(p, `La oficina canceló la OT-${o.numero} (${o.direccion}): ${cajon.motivo.toLowerCase()}.`, "cancelada"));
    cancelando = null; cajon = null; toast(`OT-${o.numero} cancelada`); guardar(); render();
  },
  reabrirInicio: (d) => { reabriendo = d.id; cancelando = null; cajon.motivo = null; render(); },
  reabrirMotivo: (d) => { cajon.motivo = d.v; render(); },
  reabrirOk: (d) => { reprogramar(d.id, cajon.motivo); reabriendo = null; cajon = null; render(); },
  reprogramar: (d) => { reprogramar(d.id, d.v); render(); },
  cerrarSin: (d) => {
    const o = S.ordenes.find((x) => x.id === d.id); if (!o) return;
    const motivo = `Cerrada sin resolver: ${RESULTADOS[o.resultado]?.label.toLowerCase() ?? ""}`;
    o.estado = "cancelada"; o.motivoCancelacion = motivo; o.eventos.push({ tipo: "cancelada", at: ahora(), autorId: ADMIN, motivo });
    auditar(`Cerró sin resolver OT-${o.numero}`, motivo, { ordenId: o.id }); avisar(o.liderId, `La oficina cerró la OT-${o.numero} sin resolver.`, "cancelada");
    guardar(); render();
  },
  novedadVista: (d) => { const o = S.ordenes.find((x) => x.id === d.id); if (!o?.novedad) return;
    auditar(`Tomó el aviso “${o.novedad.texto}” de OT-${o.numero}`, "", { ordenId: o.id }); avisar(o.novedad.autorId, `La oficina vio tu aviso “${o.novedad.texto}” de la OT-${o.numero} y lo está resolviendo.`); o.novedad = null; guardar(); render(); },
  fUrg: (d) => { F.urgencia = d.v; render(); },
  fTipo: (d) => { F.tipo = d.v; render(); if (d.v === "otro") $("#f-tipo-otro")?.focus(); },
  fAsig: (d) => { F.asignados = F.asignados.includes(d.id) ? F.asignados.filter((x) => x !== d.id) : [...F.asignados, d.id]; if (!F.asignados.includes(F.lider) || F.asignados.length === 1) F.lider = F.asignados[0] ?? ""; render(); },
  fLider: (d) => { F.lider = d.id; render(); },
  rango: (d) => { S.rango.tipo = d.v; if (d.v === "custom" && !S.rango.desde) { S.rango.desde = iso(inicioDia() - 13 * DIA); S.rango.hasta = iso(ahora()); } guardar(); render(); },
  verHoras: (d) => { abiertoHoras = abiertoHoras === d.id ? null : d.id; render(); },
  corregirFichaje: (d) => { cajon = { tipo: "fichaje", fichajeId: d.id || null, personaId: d.p ?? S.fichajes.find((f) => f.id === d.id)?.personaId, solicitudId: d.v ?? null, motivo: null }; render(); },
  fxMotivo: (d) => { cajon.motivo = d.v; render(); },
  solicitudLista: (d) => { const s = S.solicitudes.find((x) => x.id === d.id); if (!s) return; s.estado = "resuelta"; auditar(`Marcó como resuelto el pedido de ${nombreDe(s.personaId)}: ${s.texto.toLowerCase()}`, "No hacía falta corregir"); guardar(); render(); },
  csv: (d) => exportar(d.v),
};

function reprogramar(id, motivo) {
  const o = S.ordenes.find((x) => x.id === id); if (!o) return;
  const antes = EST[o.estado].label;
  Object.assign(o, { estado: "pendiente", visto: null, enCamino: null, llegada: null, finalizada: null, cierre: null, resultado: null, motivoResultado: null, novedad: null, ultimaNovedad: ahora() });
  o.eventos.push({ tipo: antes === "Resuelta" ? "reabierta" : "reprogramada", at: ahora(), autorId: ADMIN, motivo });
  auditar(`${antes === "Resuelta" ? "Reabrió" : "Reprogramó"} OT-${o.numero} (estaba: ${antes.toLowerCase()})`, motivo, { ordenId: id });
  avisar(o.liderId, `La oficina volvió a pendiente la OT-${o.numero} (${o.direccion}): ${motivo.toLowerCase()}.`);
  flash[id] = ahora() + 2600; toast(`OT-${o.numero} vuelve a pendiente`); guardar();
}

function exportar(tipo) {
  const H = datosHoras(), O = datosOrdenes(), h = horasDec;
  const sufijo = `${iso(H.desde)}_a_${iso(H.hasta - DIA)}`;
  if (tipo === "horas") descargarCSV(`horas_${sufijo}.csv`, ["Empleado", "DNI", "Días", "Normales (h)", "Extra (h)", "Nocturnas (h)", "Finde/feriado (h)", "Total (h)", "Estado"],
    H.totales.map((x) => { const p = S.personas.find((q) => q.id === x.personaId); return [p.nombre, p.dni, x.dias, h(x.normales), h(x.extra), h(x.noche), h(x.finde), h(x.total), x.provisorio.length ? `Provisorio: ${x.provisorio.join(", ")}` : "Completo"]; }));
  if (tipo === "fichajes") descargarCSV(`fichajes_${sufijo}.csv`, ["Fecha", "Empleado", "Entrada", "Salida", "Horas brutas", "Fichado por", "Hora declarada", "Llegó sin señal", "Corrección", "Corregido por"],
    H.dias.flatMap((d) => d.fichajes.map((f) => [new Date(f.entrada).toLocaleDateString("es-AR"), nombreDe(f.personaId), hora(f.entrada), f.salida ? hora(f.salida) : "SIN SALIDA",
      h(((f.salida ?? ahora()) - f.entrada) / MIN), nombreDe(f.fichadoPor), f.meta?.entrada?.corregida || f.meta?.salida?.corregida ? "Sí" : "No", f.meta?.entrada?.demora || f.meta?.salida?.demora ? "Sí" : "No",
      f.correccion?.motivo ?? "", f.correccion ? nombreDe(f.correccion.quien) : ""])));
  if (tipo === "ordenes") descargarCSV(`intervenciones_${sufijo}.csv`, ["OT", "Creada", "Tipo", "Trabajo a realizar", "Urgencia", "Estado", "Resultado", "Dirección", "Veces en el período", "Cuadrilla", "Líder", "Equipo", "Salida", "Llegada", "Cierre", "Asignación→salida (min)", "Salida→llegada (min)", "Llegada→resolución (min)", "Hora corregida", "Notas"],
    O.todas.map((o) => { const x = O.tiempos(o), r = (v) => (v == null ? null : Math.round(v)); return [o.numero, fechaHora(o.creada), tipoTexto(o), o.descripcion, URG[o.urgencia].label, EST[o.estado].label,
      o.resultado ? RESULTADOS[o.resultado].label + (o.motivoResultado ? `: ${o.motivoResultado}` : "") : o.motivoCancelacion ?? "", o.direccion, O.repetidas(o),
      S.cuadrillas.find((c) => c.id === o.cuadrillaId)?.nombre ?? "", nombreDe(o.liderId), o.asignados.map(nombreDe).join(", "),
      o.enCamino ? fechaHora(o.enCamino) : "", o.llegada ? fechaHora(o.llegada) : "", o.cierre ? fechaHora(o.cierre) : "", r(x.as), r(x.sl), r(x.lr),
      o.eventos.some((e) => e.corregida) ? "Sí" : "No", o.notas.map((n) => `${hora(n.at)} ${corto(n.autorId)}: ${n.texto}`).join(" | ")]; }));
}

// =====================================================================
// Eventos del DOM
// =====================================================================
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]");
  if (!b || b.disabled) return;
  if (b.tagName === "A" && b.dataset.a === "prefNav") { ACC.prefNav(b.dataset); return; } // el link se abre igual
  if (b.tagName === "TR" && e.target.closest("button")) return;
  e.preventDefault(); ACC[b.dataset.a]?.(b.dataset);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (cajon) ACC.cerrarCajon(); else if (hoja) ACC.cerrarHoja(); } });
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.foto) { cargarFoto(t); return; }
  if (t.dataset.cfgFoto) { S.config.fotoObligatoria[t.dataset.cfgFoto] = t.checked; guardar(); render(); }
  if (t.dataset.rango) { S.rango[t.dataset.rango] = t.value; guardar(); render(); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.nota) textoNota = t.value;
  if (t.dataset.login) { t.value = t.value.replace(/\D/g, ""); login[t.dataset.login] = t.value; }
  if (t.dataset.busca) { busqueda = t.value; render(); }
  if (t.dataset.fx) cajon[t.dataset.fx] = t.value;
  if (t.dataset.cfg) { const k = t.dataset.cfg; S.config[k] = t.type === "number" ? Number(t.value) : t.value; guardar(); }
  if (t.dataset.f) {
    F[t.dataset.f] = t.value;
    if (t.dataset.f === "cuadrilla") { F.asignados = [...(S.cuadrillas.find((c) => c.id === t.value)?.miembros ?? [])]; F.lider = F.asignados[0] ?? ""; render(); }
  }
});
document.addEventListener("focusout", (e) => { if (e.target.dataset?.cfg) render(); });

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "form-login") {
    const p = S.personas.find((x) => x.dni === login.dni && x.pin === login.pin);
    if (!p) errorLogin = "El DNI o el PIN no coinciden.";
    else if (p.rol === "admin") errorLogin = "Ana es administradora: usá el panel.";
    else return entrar(p);
    render();
  }
  if (id === "form-orden") guardarOrden();
  if (id === "form-fichaje") guardarFichaje();
});

function guardarOrden() {
  F.error = "";
  if (F.tipo === "otro" && F.tipoOtro.trim().length < 3) F.error = "Escribí qué tipo de trabajo es.";
  else if (F.direccion.trim().length < 3) F.error = "Falta la dirección.";
  else if (!F.asignados.length) F.error = "Marcá al menos a una persona.";
  else if (!F.asignados.includes(F.lider)) F.error = "Elegí al líder entre los asignados.";
  if (F.error) return render();
  const datos = { tipo: F.tipo, tipoOtro: F.tipo === "otro" ? F.tipoOtro.trim() : "", urgencia: F.urgencia, direccion: F.direccion.trim(), referencia: F.referencia.trim(),
    telefono: F.telefono.trim(), descripcion: F.descripcion.trim(), horario: F.horario ? new Date(F.horario).getTime() : null, cuadrillaId: F.cuadrilla || null };
  if (F.modo === "editar") {
    const o = S.ordenes.find((x) => x.id === F.id); if (!o) return;
    const nombres = { direccion: "dirección", urgencia: "urgencia", tipo: "tipo", tipoOtro: "tipo", referencia: "referencia", telefono: "teléfono", descripcion: "trabajo a realizar", horario: "horario", cuadrillaId: "cuadrilla" };
    const cambios = [...new Set(Object.keys(datos).filter((k) => (o[k] ?? "") !== (datos[k] ?? "")).map((k) => nombres[k]))];
    const quitados = o.asignados.filter((p) => !F.asignados.includes(p)), agregados = F.asignados.filter((p) => !o.asignados.includes(p));
    Object.assign(o, datos);
    if (quitados.length || agregados.length) { cambios.push("equipo"); quitados.forEach((p) => avisar(p, `Ya no estás asignado a la OT-${o.numero} (${o.direccion}).`, "reasignada")); agregados.forEach((p) => avisar(p, `Te sumaron a la OT-${o.numero} (${o.direccion}).`)); }
    const liderAnt = o.liderId;
    o.asignados = [...F.asignados];
    if (F.lider !== liderAnt) { o.liderId = liderAnt; cambiarLider(o.id, F.lider, "Edición de la orden"); }
    if (cambios.length) { auditar(`Editó OT-${o.numero}: ${cambios.join(", ")}`, "", { ordenId: o.id }); avisar(o.liderId, `La oficina cambió la OT-${o.numero}: ${cambios.join(", ")}. Revisá los datos.`); }
    flash[o.id] = ahora() + 2600; cajon = { tipo: "detalle", id: o.id };
  } else {
    const o = nuevaOrden({ ...datos, id: uid(), numero: S.sigNumero++, liderId: F.lider, asignados: [...F.asignados], creada: ahora() });
    S.ordenes.push(o); flash[o.id] = ahora() + 2600;
    toast(`OT-${o.numero} asignada a ${nombreDe(o.liderId)}`);
    cajon = null; S.tab = "tablero";
    if (S.online && o.liderId === S.sesion) { sonar("alerta"); ultimoBeep = ahora(); }
  }
  F = formVacio(); guardar(); render();
}

function guardarFichaje() {
  const c = cajon, ent = c.entrada ?? $("#fx-ent")?.value, sal = c.salida ?? $("#fx-sal")?.value;
  c.error = "";
  if (!c.motivo) c.error = "Elegí el motivo de la corrección.";
  else if (!ent) c.error = "Falta la hora de entrada.";
  else if (sal && new Date(sal) <= new Date(ent)) c.error = "La salida tiene que ser posterior a la entrada.";
  if (c.error) return render();
  const e1 = new Date(ent).getTime(), s1 = sal ? new Date(sal).getTime() : null;
  let f = S.fichajes.find((x) => x.id === c.fichajeId);
  if (f) {
    auditar(`Corrigió el fichaje de ${nombreDe(f.personaId)}: ${fechaHora(f.entrada)}–${f.salida ? hora(f.salida) : "sin salida"} pasó a ${fechaHora(e1)}–${s1 ? hora(s1) : "sin salida"}`, c.motivo, { fichajeId: f.id });
    f.original ??= { entrada: f.entrada, salida: f.salida };
    f.entrada = e1; f.salida = s1;
  } else {
    if (!s1 && S.fichajes.some((x) => x.personaId === c.personaId && !x.salida)) { c.error = "Esa persona ya tiene un turno abierto: cargá también la salida."; return render(); }
    f = { id: uid(), personaId: c.personaId, entrada: e1, salida: s1, fichadoPor: ADMIN, meta: {} };
    S.fichajes.push(f);
    auditar(`Agregó un fichaje a ${nombreDe(c.personaId)}: ${fechaHora(e1)}–${s1 ? hora(s1) : "sin salida"}`, c.motivo, { fichajeId: f.id });
  }
  f.correccion = { motivo: c.motivo, quien: ADMIN, at: ahora() };
  const sol = S.solicitudes.find((s) => s.id === c.solicitudId);
  if (sol) sol.estado = "resuelta";
  avisar(f.personaId, `La oficina corrigió tu fichaje del ${fechaCorta(e1)}: ${hora(e1)} a ${s1 ? hora(s1) : "sin salida"} (${c.motivo.toLowerCase()}).`);
  toast(`Fichaje de ${corto(f.personaId)} corregido`);
  cajon = null; guardar(); render();
}

// =====================================================================
// Reloj
// =====================================================================
setInterval(() => {
  let cambio = false;
  if (deshacible && ahora() - deshacible.desde > GRACIA) { deshacible = null; cambio = true; }
  if (bloqueoHasta && bloqueoHasta > ahora() - 400) cambio = true; // cuenta regresiva del bloqueo
  for (const [k, v] of Object.entries(flash)) if (v <= ahora()) { delete flash[k]; cambio = true; }
  if (toasts.some((x) => x.hasta <= ahora())) renderToasts();
  // Emergencia sin "Recibido": el celular vuelve a sonar cada 2 minutos
  if (S.sesion && S.online) {
    const pend = S.ordenes.find((o) => o.liderId === S.sesion && o.urgencia === "emergencia" && o.estado === "pendiente" && !o.visto && !S.cola.some((a) => a.ordenId === o.id && a.evento === "visto"));
    if (pend && ahora() - ultimoBeep > 2 * MIN) { ultimoBeep = ahora(); sonar("alerta"); }
  }
  sincronizar();
  if (cambio && !enviando && !dictado) render();
}, 300);
setInterval(() => { if (!cajon && !dictado && !hoja) render(); }, 30000);

$("#logo").innerHTML = ic("gota", "size-5");
$("#btn-reiniciar").innerHTML = ic("girar", "size-[18px]");
render();
</script>
</body>
</html>
